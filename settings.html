<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Account</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Tasksy design system tokens + Tasksy skin overlay -->
<link rel="stylesheet" href="design-system/colors_and_type.css">
<link rel="stylesheet" href="tasksy-skin.css">

<!-- Apply persisted dark mode before paint to avoid FOUC -->
<script>
  (function(){
    try {
      var _dm = localStorage.getItem('zipDarkMode') === '1';
      if (_dm) { document.documentElement.classList.add('dark'); document.documentElement.setAttribute('data-theme','dark'); }
      else { document.documentElement.setAttribute('data-theme','light'); }
    } catch(e){}
  })();
</script>

<style>
body{
    font-family: Inter, system-ui, sans-serif;
    font-size: 14.5px;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
}

.top-text{
    font-size:13.5px;
    font-weight:500;
}

.account-tile{
    width:158px;
    height:178px;
    background:#fff;
    border:1px solid #e8edf3;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(15,23,42,.05);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    cursor:pointer;
    transition:all .2s ease;
}
.account-tile:hover{
    box-shadow:0 8px 24px rgba(15,23,42,.10);
    transform:translateY(-2px);
}
.account-tile .tile-label{
    font-size:13.5px;
    font-weight:500;
    color:#334155;
    text-align:center;
    padding:0 10px;
}
.account-tile svg{ stroke-width:1.5; }

/* Dark mode */
html.dark body { background-color:#0f172a !important; color:#e2e8f0; }
html.dark .bg-white { background-color:#1e293b !important; }
html.dark .bg-\[\#fbfcfe\] { background-color:#0f172a !important; }
html.dark .account-tile { background:#1e293b; border-color:#2d3f55; }
html.dark .account-tile .tile-label { color:#e2e8f0; }
html.dark .text-slate-700, html.dark .text-slate-800 { color:#f1f5f9 !important; }
html.dark .border-slate-100, html.dark .border-slate-200 { border-color:#2d3f55 !important; }
html.dark #myAppsMenu, html.dark #storeMenu { background-color:#1e293b !important; border-color:#2d3f55 !important; color:#e2e8f0; }
html.dark #myAppsMenu .hover\:bg-slate-100:hover, html.dark #storeMenu .hover\:bg-slate-100:hover { background-color:#243860 !important; }
html.dark #myAppsMenu .border-slate-100 { border-color:#2d3f55 !important; }
</style>
</head>

<body class="h-screen overflow-hidden bg-[#fbfcfe] flex flex-col">

<!-- TOP BAR (settings variant) -->
<div class="h-14 bg-[#101828] text-white flex items-center justify-between px-4 shrink-0">

    <!-- LEFT -->
    <div class="flex items-center gap-5 top-text">

        <!-- SETTINGS APP ICON -->
        <a href="settings.html" class="w-9 h-9 rounded-lg bg-white flex items-center justify-center shadow-sm">
            <i data-lucide="settings" class="w-5 h-5 text-[#3b82f6]"></i>
        </a>

        <!-- MY APPS DROPDOWN -->
        <div class="relative">
            <button id="myAppsBtn" onclick="toggleMyApps()"
                class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-white/10 transition">
                <i data-lucide="grip" class="w-4 h-4"></i>
                <span>My Apps</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-[#7db4f8]"></i>
            </button>

            <div id="myAppsMenu"
                class="hidden absolute left-0 mt-2 w-60 bg-white text-slate-700 rounded-xl shadow-xl border border-slate-100 text-[13.5px] py-2 z-[90]">

                <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#8b5cf6">
                        <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>AI Dashboard</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#1e3a8a">
                        <i data-lucide="workflow" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>Workflow</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#0ea5e9">
                        <i data-lucide="clock" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>Zip Clock</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#10b981">
                        <i data-lucide="trending-up" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>Zip Forecasting</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#4f46e5">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>Zip Reports</span>
                </div>

                <div class="my-1 border-t border-slate-100"></div>

                <a href="settings.html" class="flex items-center gap-3 px-4 py-2 hover:bg-slate-100 cursor-pointer">
                    <span class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background:#64748b">
                        <i data-lucide="settings" class="w-4 h-4 text-white"></i>
                    </span>
                    <span>Settings</span>
                </a>

            </div>
        </div>

        <!-- BACK TO ZIP SCHEDULES -->
        <a href="index.html" class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-white/10 transition">
            <i data-lucide="circle-arrow-left" class="w-5 h-5"></i>
            <span>Zip Schedules</span>
        </a>

    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-4 top-text">

        <!-- ENTITY DROPDOWN -->
        <div class="relative">
            <button id="storeBtn" onclick="toggleStore()"
                class="bg-white text-slate-700 px-4 py-1 rounded-full flex items-center gap-2">
                <i data-lucide="building-2" class="w-4"></i>
                Original Fish Taco, LLC
                <i data-lucide="chevron-down" class="w-4"></i>
            </button>
            <div id="storeMenu"
                class="hidden absolute right-0 mt-2 w-56 bg-white text-slate-700 rounded-lg shadow-lg text-[13px] z-[90]">
                <div class="px-4 py-2 hover:bg-slate-100 cursor-pointer">085 - Del Mar</div>
                <div class="px-4 py-2 hover:bg-slate-100 cursor-pointer">086 - Santa Ana</div>
                <div class="px-4 py-2 hover:bg-slate-100 cursor-pointer">087 - Riverside</div>
            </div>
        </div>

        <button title="My Profile"
            class="w-8 h-8 rounded-full bg-slate-200 hover:ring-2 hover:ring-white/60 transition flex items-center justify-center overflow-hidden">
            <i data-lucide="user" class="w-4 h-4 text-slate-500"></i>
        </button>

    </div>

</div>

<!-- BREADCRUMB -->
<div class="bg-white border-b border-slate-100 px-5 py-2.5 shrink-0">
    <span class="text-[13px] font-medium text-[#3b82f6] cursor-pointer">Manage Account</span>
</div>

<!-- MAIN CONTENT -->
<div class="flex-1 overflow-y-auto">
    <div class="max-w-[1000px] mx-auto px-6 pt-14 pb-16">

        <h1 class="text-[26px] font-medium text-slate-700 text-center mb-12">Manage Account</h1>

        <div class="flex flex-wrap justify-center gap-9">

            <a href="my-organization.html" class="account-tile">
                <i data-lucide="building-2" class="w-14 h-14" style="color:#3b82f6"></i>
                <span class="tile-label">My Organization</span>
            </a>

            <div class="account-tile">
                <i data-lucide="map-pin" class="w-14 h-14" style="color:#f59e0b"></i>
                <span class="tile-label">Sites</span>
            </div>

            <div class="account-tile">
                <i data-lucide="shapes" class="w-14 h-14" style="color:#6366f1"></i>
                <span class="tile-label">App Settings</span>
            </div>

            <div class="account-tile">
                <i data-lucide="receipt" class="w-14 h-14" style="color:#10b981"></i>
                <span class="tile-label">Billing &amp; Subscription</span>
            </div>

            <div class="account-tile">
                <i data-lucide="user-cog" class="w-14 h-14" style="color:#8b5cf6"></i>
                <span class="tile-label">Profile Settings</span>
            </div>

            <div class="account-tile">
                <i data-lucide="building" class="w-14 h-14" style="color:#0284c7"></i>
                <span class="tile-label">Franchise Groups</span>
            </div>

            <div class="account-tile">
                <i data-lucide="users" class="w-14 h-14" style="color:#a855f7"></i>
                <span class="tile-label">Admin Users</span>
            </div>

            <div class="account-tile">
                <i data-lucide="file-search" class="w-14 h-14" style="color:#7c3aed"></i>
                <span class="tile-label">Audit Logs</span>
            </div>

        </div>
    </div>
</div>

<!-- FLOATING HELP BUBBLE -->
<button title="Help & Support"
    class="fixed bottom-4 left-4 w-11 h-11 rounded-full bg-sky-100 text-sky-500 flex items-center justify-center shadow-md hover:bg-sky-200 transition z-[80]">
    <i data-lucide="headset" class="w-5 h-5"></i>
</button>

<script>
function toggleMyApps(){ const m = document.getElementById("myAppsMenu"); if(m) m.classList.toggle("hidden"); }
function toggleStore(){ const m = document.getElementById("storeMenu"); if(m) m.classList.toggle("hidden"); }

document.addEventListener('click', function(e){
    [['myAppsMenu','myAppsBtn'],['storeMenu','storeBtn']].forEach(function(pair){
        const m = document.getElementById(pair[0]);
        const b = document.getElementById(pair[1]);
        if (m && !m.classList.contains('hidden') && !m.contains(e.target) && !(b && b.contains(e.target))) m.classList.add('hidden');
    });
});

lucide.createIcons();
</script>

</body>
</html>
